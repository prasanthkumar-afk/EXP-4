<!DOCTYPE html>
<html>
<head>
    <title>Basic E-Commerce</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        /* ================= NAVIGATION BAR ================= */

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;

            background-color: #222;
            padding: 20px 40px;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        .nav-links a:hover {
            color: orange;
        }

        /* ================= BANNER ================= */

        .banner {
            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;

            height: 250px;

            background-color: orange;
            color: white;
        }

        .banner h1 {
            font-size: 40px;
        }

        .banner p {
            margin-top: 10px;
            font-size: 18px;
        }

        /* ================= PRODUCTS ================= */

        .products {
            width: 90%;
            margin: 40px auto;
        }

        .products h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 30px;
        }

        /* GRID */

        .product-grid {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 25px;
        }

        /* ================= PRODUCT BOX ================= */

        .product {
            background-color: white;

            border: 1px solid #ddd;
            border-radius: 10px;

            padding: 20px;

            text-align: center;

            box-shadow: 0 3px 8px #ccc;

            /* Smooth animation */
            transition: all 0.3s ease;
        }

        /* ================= PRODUCT HIGHLIGHT ================= */

        .product:hover {
            transform: scale(1.05);

            border: 2px solid orange;

            background-color: #fff8e1;

            box-shadow: 0 8px 20px #999;
        }

        /* ================= PRODUCT IMAGE ================= */

        .product img {
            width: 150px;
            height: 150px;

            object-fit: cover;

            border-radius: 8px;

            transition: all 0.3s ease;
        }

        /* Image Highlight */

        .product:hover img {
            transform: scale(1.08);
        }

        /* ================= PRODUCT NAME ================= */

        .product h3 {
            margin: 15px 0 10px;

            font-size: 20px;
        }

        /* ================= PRICE ================= */

        .price {
            color: green;

            font-size: 20px;

            font-weight: bold;

            margin-bottom: 15px;
        }

        /* ================= BUTTON ================= */

        .product button {
            background-color: orange;

            color: white;

            border: none;

            padding: 10px 20px;

            border-radius: 5px;

            cursor: pointer;

            font-size: 15px;

            transition: 0.3s;
        }

        .product button:hover {
            background-color: darkorange;

            transform: scale(1.05);
        }

        /* ================= FOOTER ================= */

        footer {
            display: flex;

            justify-content: center;
            align-items: center;

            background-color: #222;

            color: white;

            padding: 20px;

            margin-top: 40px;
        }

        /* ================= RESPONSIVE DESIGN ================= */

        @media (max-width: 700px) {

            .navbar {
                flex-direction: column;

                gap: 15px;
            }

            .nav-links {
                flex-wrap: wrap;

                justify-content: center;
            }

            .product-grid {
                grid-template-columns: 1fr;
            }

            .banner h1 {
                font-size: 30px;
            }
        }

    </style>
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <div class="navbar">

        <div class="logo">
            ShopEasy
        </div>

        <div class="nav-links">

            <a href="#">Home</a>

            <a href="#">Products</a>

            <a href="#">Cart</a>

            <a href="#">Contact</a>

        </div>

    </div>


    <!-- ================= BANNER ================= -->

    <div class="banner">

        <div>

            <h1>Welcome to ShopEasy</h1>

            <p>Best products at affordable prices</p>

        </div>

    </div>


    <!-- ================= PRODUCTS ================= -->

    <div class="products">

        <h2>Our Products</h2>

        <div class="product-grid">


            <!-- PRODUCT 1 -->

            <div class="product">

                <img
                    src="WhatsApp Image 2026-08-17 at 11.55.34 AM (1).jpeg"
                    alt="T-Shirt"
                >

                <h3>Men's T-Shirt</h3>

                <p class="price">₹499</p>

                <button>Add to Cart</button>

            </div>


            <!-- PRODUCT 2 -->

            <div class="product">

                <img
                    src="WhatsApp Image 2026-08-17 at 11.55.34 AM (2).jpeg"
                    alt="Shoes"
                >

                <h3>Sports Shoes</h3>

                <p class="price">₹1,499</p>

                <button>Add to Cart</button>

            </div>


            <!-- PRODUCT 3 -->

            <div class="product">

                <img
                    src="WhatsApp Image 2026-08-17 at 11.55.34 AM (3).jpeg"
                    alt="Watch"
                >

                <h3>Smart Watch</h3>

                <p class="price">₹999</p>

                <button>Add to Cart</button>

            </div>


            <!-- PRODUCT 4 -->

            <div class="product">

                <img
                    src="WhatsApp Image 2026-08-17 at 11.55.34 AM (4).jpeg"
                    alt="Bag"
                >

                <h3>College Bag</h3>

                <p class="price">₹799</p>

                <button>Add to Cart</button>

            </div>


            <!-- PRODUCT 5 -->

            <div class="product">

                <img
                    src="WhatsApp Image 2026-08-17 at 11.55.34 AM.jpeg"
                    alt="Headphones"
                >

                <h3>Headphones</h3>

                <p class="price">₹699</p>

                <button>Add to Cart</button>

            </div>


            <!-- PRODUCT 6 -->

            <div class="product">

                <img
                    src="WhatsApp Image 2026-08-17 at 11.55.34 AM (5).jpeg"
                    alt="Sunglasses"
                >

                <h3>Sunglasses</h3>

                <p class="price">₹399</p>

                <button>Add to Cart</button>

            </div>


        </div>

    </div>


    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            © 2026 ShopEasy | All Rights Reserved
        </p>

    </footer>


</body>
</html>
